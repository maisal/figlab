[package]
name = "m-render"
description = "Stand-in for the render module (main thread)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = ["shape-rustybuzz", "standin"]
# Shaping with rustybuzz, outlines with ttf-parser.
shape-rustybuzz = ["dep:rustybuzz", "dep:ttf-parser"]
# Shaping with harfrust, outlines with skrifa.
shape-harfrust = ["dep:harfrust", "dep:skrifa"]
# figlab's own code: layout and SVG writer stand-ins.
standin = []
# Link the export modules into this module, to measure one module instead of three.
with-pdf-krilla = ["dep:m-export-pdf", "m-export-pdf/krilla"]
with-pdf-writer = ["dep:m-export-pdf", "m-export-pdf/pdf-writer"]
with-pdf-writer-skrifa = ["dep:m-export-pdf", "m-export-pdf/pdf-writer-skrifa"]
with-png = ["dep:m-export-png"]
# Generated code that stands in for the size of figlab's own code
# (S4_BALLAST_FNS functions, see rust/ballast).
ballast = ["dep:ballast"]

[dependencies]
ballast = { path = "../ballast", optional = true }
wasm-bindgen.workspace = true
standin.workspace = true
libm.workspace = true
rustybuzz = { version = "=0.20.1", optional = true }
ttf-parser = { version = "=0.25.1", optional = true }
# Default features off and only `libm`, as S1 (ADR 0010) recommends: no std,
# so read-fonts uses libm for float functions.
harfrust = { version = "=0.14.0", optional = true, default-features = false, features = ["libm"] }
skrifa = { version = "=0.48.0", optional = true, default-features = false, features = ["libm"] }
m-export-pdf = { path = "../export-pdf", optional = true, default-features = false }
m-export-png = { path = "../export-png", optional = true }
