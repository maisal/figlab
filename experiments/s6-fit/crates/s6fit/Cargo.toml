[package]
name = "s6fit"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = ["cmpfit"]
# Build cmpfit 1.5 from downloads/cmpfit (scripts/fetch.sh).
cmpfit = ["dep:cc"]

[dependencies]
libm.workspace = true
levenberg-marquardt.workspace = true
lm-bounded.workspace = true
nalgebra = { workspace = true, features = ["alloc", "libm"] }
rmpfit.workspace = true

[build-dependencies]
cc = { workspace = true, optional = true }
