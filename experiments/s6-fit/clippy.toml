# The standard float functions call the math library of the operating system.
# Their results can differ between native builds and wasm. figlab must give
# bit-identical results everywhere (docs/language.md 10.2), so use the libm
# crate instead (figlab_core::math).
#
# Not listed: sqrt, mul_add, floor, ceil, round, trunc, abs, and similar.
# IEEE 754 requires them to be exact or correctly rounded.
disallowed-methods = [
    { path = "f64::sin", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::cos", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::tan", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::sin_cos", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::asin", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::acos", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::atan", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::atan2", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::sinh", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::cosh", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::tanh", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::asinh", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::acosh", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::atanh", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::exp", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::exp2", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::exp_m1", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::ln", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::log", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::log2", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::log10", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::ln_1p", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::powf", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::powi", reason = "the result depends on how the compiler expands it; use figlab_core::math::pow" },
    { path = "f64::cbrt", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f64::hypot", reason = "use figlab_core::math (libm) for bit-identical results" },
    { path = "f32::sin", reason = "use libm (sinf, etc.) for bit-identical results" },
    { path = "f32::cos", reason = "use libm (sinf, etc.) for bit-identical results" },
    { path = "f32::tan", reason = "use libm (sinf, etc.) for bit-identical results" },
    { path = "f32::sin_cos", reason = "use libm (sinf, etc.) for bit-identical results" },
    { path = "f32::asin", reason = "use libm (sinf, etc.) for bit-identical results" },
    { path = "f32::acos", reason = "use libm (sinf, etc.) for bit-identical results" },
    { path = "f32::atan", reason = "use libm (sinf, etc.) for bit-identical results" },
    { path = "f32::atan2", reason = "use libm (sinf, etc.) for bit-identical results" },
    { path = "f32::exp", reason = "use libm (sinf, etc.) for bit-identical results" },
    { path = "f32::exp2", reason = "use libm (sinf, etc.) for bit-identical results" },
    { path = "f32::ln", reason = "use libm (sinf, etc.) for bit-identical results" },
    { path = "f32::log", reason = "use libm (sinf, etc.) for bit-identical results" },
    { path = "f32::log2", reason = "use libm (sinf, etc.) for bit-identical results" },
    { path = "f32::log10", reason = "use libm (sinf, etc.) for bit-identical results" },
    { path = "f32::powf", reason = "use libm (sinf, etc.) for bit-identical results" },
    { path = "f32::powi", reason = "the result depends on how the compiler expands it; use libm::powf" },
    { path = "f32::hypot", reason = "use libm (sinf, etc.) for bit-identical results" },
]
