<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>figlab S4 stand-in (plain)</title>
    <style>
      body { margin: 0; font: 13px system-ui, sans-serif; display: grid; grid-template: "top top" 36px "side main" 1fr "cmd cmd" 140px / 220px 1fr; height: 100vh; }
      #top { grid-area: top; display: flex; gap: 6px; align-items: center; padding: 0 8px; border-bottom: 1px solid #ccc; }
      #side { grid-area: side; border-right: 1px solid #ccc; overflow: auto; }
      #main { grid-area: main; position: relative; }
      #cmd { grid-area: cmd; border-top: 1px solid #ccc; overflow: hidden; }
      #cmd .cm-editor { height: 100%; }
      #status { position: absolute; bottom: 4px; right: 8px; color: #666; }
      canvas { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main-plain.ts"></script>
  </body>
</html>
