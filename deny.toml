# Checks of Rust dependencies with cargo-deny (docs/development.md 6.6).
# `mise run check:deps` runs `cargo deny check licenses bans sources`.

[graph]
all-features = true

[licenses]
# The allow list in docs/development.md 6.6. Adding a license needs a reason,
# written as a comment here. OFL-1.1 is allowed for fonts only, and fonts are
# not crates, so it is not listed. The Minpack license is allowed only for
# code ported from MINPACK and copied into figlab (ADR 0015). That code is not
# a crate, so Minpack is not listed either.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.93
# The list is a policy, so licenses that no crate uses yet are fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The crates in this workspace depend on each other by path only.
allow-wildcard-paths = true

[sources]
# Crates come only from crates.io (docs/development.md 5.2).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
