name: Feature request
description: A new feature or a change to an existing one.
labels: ["kind:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The task or the figure you want to make, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How figlab could help
      description: For example a command, an option, or a GUI operation.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
