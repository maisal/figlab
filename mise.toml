# Pinned versions of development tools (see docs/development.md 3.1).
# Upgrade all tools together and make sure CI passes.
[tools]
jj = "0.46.0"
jjui = "0.10.11"
rust = { version = "1.99.0", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
node = "24.14.1"
pnpm = "10.25.0"
ripgrep = "15.1.0"
cargo-deny = "0.20.2"
"github:EmbarkStudios/cargo-about" = "0.9.2"
# Add wasm-bindgen-cli with the same version as wasm-bindgen when it is added to Cargo.toml.

[tasks.check]
description = "Checks to pass before opening a PR"
depends = ["check:rust", "check:lang", "check:english", "check:deps", "check:web"]

[tasks."check:rust"]
description = "Rust format check, clippy, tests, and a wasm build check"
run = [
    "cargo fmt --all --check",
    "cargo clippy --workspace --all-targets --locked -- -D warnings",
    "cargo test --workspace --locked",
    "cargo check -p figlab-wasm --target wasm32-unknown-unknown --locked",
]

[tasks."check:lang"]
description = "Check spec/*.json and the conformance test files (docs/language.md 10)"
depends = ["install:web"]
run = "node tools/check-spec.mjs"

[tasks."check:english"]
description = "Fail if CJK text appears outside test fixtures"
run = "rg -n --hidden --glob '!.git/' --glob '!.jj/' '[\\p{Han}\\p{Hiragana}\\p{Katakana}\\p{Hangul}]' --glob '!tests/import/**' --glob '!tests/**/fixtures/**' . && exit 1 || test $? -eq 1"   # rg exits 0 on a match, 1 on no match, 2 on an error. Tasks run with errexit, so use && and ||. --hidden also checks tracked dot folders such as .claude/ and .github/

[tasks."check:deps"]
description = "Check the licenses and sources of dependencies (docs/development.md 6.6)"
depends = ["install:web"]
run = [
    "cargo deny --locked check licenses bans sources",
    "node tools/check-npm-licenses.mjs",
]

[tasks."check:web"]
description = "Web type check, lint, format check, and unit tests"
depends = ["install:web"]
run = [
    "pnpm run -s typecheck",
    "pnpm run -s lint",
    "pnpm run -s format:check",
    "pnpm run -s test",
]

[tasks."install:web"]
description = "Install the npm packages from pnpm-lock.yaml"
run = "pnpm install --frozen-lockfile"

[tasks.fix]
description = "Format every change in the stack with jj fix (docs/development.md 4.1)"
depends = ["install:web"]
run = "jj --config-file tools/jj-repo-config.toml fix -s 'roots(trunk()..@)'"

[tasks.dev]
description = "Start the web app locally"
depends = ["install:web"]
run = "pnpm run dev"
